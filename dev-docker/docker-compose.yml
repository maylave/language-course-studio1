# Dev-окружение: бэк (Express + TS) и фронт (Vue + Vite).
# Запуск из этой папки:  docker compose up --build --watch
name: dev-docker

services:
  back:
    build:
      context: ../back
      dockerfile: ../dev-docker/back.Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    develop:
      watch:
        - action: sync
          path: ../back/src
          target: /app/src
        - action: sync+restart
          path: ../back/tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ../back/package.json

  front:
    build:
      context: ../front
      dockerfile: ../dev-docker/front.Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - back
    develop:
      watch:
        - action: sync
          path: ../front/src
          target: /app/src
        - action: sync
          path: ../front/public
          target: /app/public
        - action: sync
          path: ../front/index.html
          target: /app/index.html
        - action: sync+restart
          path: ../front/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ../front/package.json
